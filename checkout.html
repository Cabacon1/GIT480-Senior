<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poppy & Crumb Home</title>
    <meta name="robots" content="index,follow" />
    <!-- style -->
    <link rel="stylesheet" href="/styles.css" />
    <!-- Javascript -->
    <script src="/app.js" async></script>
</head>

<body>
    <header>
        <div class="div off-screen-menu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="/product.html">Products</a></li>
                <li><a href="/checkout.html">About</a></li>
            </ul>
        </div>
        <nav>
            <h1 id="title">Poppy & Crumb</h1>
            <div class="ham-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>
    <main>
        <!-- CheckoutScreen -->
        <h2>Checkout</h2>
        <!-- Cart Summary -->
        <section class="cart-item">
            <div class="cart-item-details">
                <h3>Product Name</h3>
                <p>Quantity: 1</p>
                <p>Price: $10.00</p>
            </div>
            <button type="button" class="remove-item" title="Remove from Cart">Remove</button>
        </section>
        <section class="cart-summary">
        </section>
        <!-- Payment Information -->
        <section class="payment-info">
            <h2>Payment Information</h2>
            <form action="/process-payment" method="POST">
                <label for="card-number">Card Number:</label>
                <input type="text" id="card-number" name="card-number" required />
                <label for="expiry-date">Expiry Date:</label>
                <input type="text" id="expiry-date" name="expiry-date" required />
                <label for="cvv">CVV:</label>
                <input type="text" id="cvv" name="cvv" required />
            </form>
        </section>

        <!-- Check Out Form -->
        <section class="checkout-form">
            <form action="/submit-order" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required />
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />
                <label for="address">Shipping Address:</label>
                <input type="text" id="address" name="address" required />
                <button type="submit">Complete Order</button>
            </form>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <p>&copy; 2023 Poppy & Crumb. All rights reserved.</p>
            <ul class="social-media">
                <li><a href="#">Facebook</a></li>
                <li><a href="#">Instagram</a></li>
                <li><a href="#">X</a></li>
            </ul>
        </div>
        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
        </div>
    </footer>
</body>

</html>
